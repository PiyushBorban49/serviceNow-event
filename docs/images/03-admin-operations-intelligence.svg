<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#FFFDF7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow4" x="0" y="0" width="200%" height="200%">
      <feOffset dx="4" dy="4" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="1"/>
      <feComposite in2="offset" in="SourceGraphic" operator="over"/>
    </filter>
    <filter id="shadow6" x="0" y="0" width="200%" height="200%">
      <feOffset dx="6" dy="6" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="1"/>
      <feComposite in2="offset" in="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="25" y="14" width="46" height="46" fill="#FFE55C" stroke="#000000" stroke-width="3" filter="url(#shadow4)"/>
  <path d="M 40 37 L 48 45 L 60 30" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <text x="85" y="38" font-size="20" font-weight="900" fill="#000000">DHRONA</text>
  <rect x="180" y="20" width="105" height="24" fill="#BAE6FD" stroke="#000000" stroke-width="2"/>
  <text x="188" y="36" font-size="10" font-weight="900" fill="#000000">STUDENT SUPPORT</text>
  <rect x="295" y="20" width="95" height="24" fill="#A7F3D0" stroke="#000000" stroke-width="2"/>
  <text x="303" y="36" font-size="10" font-weight="900" fill="#000000">CLINICAL TRIAGE</text>
  <text x="85" y="56" font-size="11" font-weight="700" fill="#4B5563">Multi-Need Navigator, Clinical Acuity Scoring &amp; Care Companion</text>

  <!-- Nav Tabs -->
  <rect x="440" y="20" width="115" height="34" fill="#F3F4F6" stroke="#000000" stroke-width="2"/>
  <rect x="475" y="24" width="75" height="26" fill="#FFE55C" stroke="#000000" stroke-width="1.5"/>
  <text x="446" y="41" font-size="9" font-weight="900">MODE:</text>
  <text x="482" y="41" font-size="9" font-weight="900">🕵️ ANONYMOUS</text>

  <rect x="565" y="20" width="105" height="34" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="578" y="42" font-size="11" font-weight="900">⚡ NAVIGATOR</text>

  <rect x="680" y="20" width="130" height="34" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="692" y="42" font-size="11" font-weight="900">🤖 CARE COMPANION</text>

  <rect x="820" y="20" width="95" height="34" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="835" y="42" font-size="11" font-weight="900">🏛️ 12 DEPTS</text>

  <!-- Admin View Active -->
  <rect x="925" y="20" width="100" height="34" fill="#FED7AA" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="938" y="42" font-size="11" font-weight="900">📊 ADMIN VIEW</text>

  <rect x="1035" y="20" width="85" height="34" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="1050" y="42" font-size="11" font-weight="900">🗂️ PITCH</text>

  <!-- Banner Ticker -->
  <rect x="0" y="75" width="1200" height="42" fill="#FEF08A" stroke="#000000" stroke-width="3"/>
  <rect x="25" y="83" width="170" height="26" fill="#000000"/>
  <text x="35" y="100" font-size="10" font-weight="900" fill="#FFE55C">CLINICAL TRIAGE SCORING</text>
  <text x="210" y="101" font-size="12" font-weight="800" fill="#000000">Natural Language Intake + 5 Objective Clinical Acuity Questions calibrate queue priority (P1 to P4).</text>

  <!-- Main Card -->
  <rect x="40" y="140" width="1120" height="500" fill="#FFFFFF" stroke="#000000" stroke-width="4" filter="url(#shadow6)"/>

  <!-- Card Header -->
  <rect x="65" y="160" width="155" height="24" fill="#FED7AA" stroke="#000" stroke-width="2"/>
  <text x="75" y="176" font-size="9" font-weight="900">OPERATIONAL INTELLIGENCE</text>

  <text x="65" y="215" font-size="24" font-weight="900">CAMPUS SUPPORT TRIAGE OPERATIONS</text>
  <text x="65" y="235" font-size="12" font-weight="700" fill="#4B5563">Aggregated university-level demand analytics. Demonstrates resource optimization &amp; queue elimination.</text>
  <text x="900" y="235" font-size="11" font-weight="700" fill="#6B7280" font-family="monospace">Live Campus Aggregation (Demo Data)</text>

  <!-- 4 Metrics Cards -->
  <!-- Card 1 -->
  <rect x="65" y="260" width="250" height="100" fill="#BAE6FD" stroke="#000" stroke-width="2.5" filter="url(#shadow4)"/>
  <text x="80" y="282" font-size="9" font-weight="900" fill="#1F2937">TOTAL STUDENT INQUIRIES</text>
  <text x="80" y="325" font-size="36" font-weight="900">128</text>
  <text x="80" y="348" font-size="10" font-weight="700" fill="#374151">Past 7 days</text>

  <!-- Card 2 -->
  <rect x="338" y="260" width="250" height="100" fill="#DDD6FE" stroke="#000" stroke-width="2.5" filter="url(#shadow4)"/>
  <text x="353" y="282" font-size="9" font-weight="900" fill="#1F2937">MULTI-NEED INQUIRIES</text>
  <text x="353" y="325" font-size="36" font-weight="900">44%</text>
  <text x="353" y="348" font-size="10" font-weight="700" fill="#374151">Cross-department cases</text>

  <!-- Card 3 -->
  <rect x="612" y="260" width="250" height="100" fill="#A7F3D0" stroke="#000" stroke-width="2.5" filter="url(#shadow4)"/>
  <text x="627" y="282" font-size="9" font-weight="900" fill="#1F2937">AVG. TIME TO HANDOFF</text>
  <text x="627" y="325" font-size="36" font-weight="900">1.8m</text>
  <text x="627" y="348" font-size="10" font-weight="700" fill="#374151">Reduced from 21 days</text>

  <!-- Card 4 -->
  <rect x="885" y="260" width="250" height="100" fill="#FFE55C" stroke="#000" stroke-width="2.5" filter="url(#shadow4)"/>
  <text x="900" y="282" font-size="9" font-weight="900" fill="#1F2937">REFERRAL BOUNCE RATE</text>
  <text x="900" y="325" font-size="36" font-weight="900">&lt; 3%</text>
  <text x="900" y="348" font-size="10" font-weight="700" fill="#374151">Reduced from +40%</text>

  <!-- Demand Breakdown Header -->
  <text x="65" y="395" font-size="13" font-weight="900">DEPARTMENT INFLUX &amp; DEMAND BREAKDOWN</text>

  <!-- Progress Bar 1 -->
  <text x="65" y="422" font-size="11" font-weight="800">🧠 Mental Wellbeing (Counselling)</text>
  <text x="1000" y="422" font-size="11" font-weight="800">42 requests (33%)</text>
  <rect x="65" y="430" width="1070" height="18" fill="#E5E7EB" stroke="#000" stroke-width="2"/>
  <rect x="65" y="430" width="353" height="18" fill="#DDD6FE" stroke="#000" stroke-width="2"/>

  <!-- Progress Bar 2 -->
  <text x="65" y="472" font-size="11" font-weight="800">📚 Academic Success &amp; Advising</text>
  <text x="1000" y="472" font-size="11" font-weight="800">48 requests (38%)</text>
  <rect x="65" y="480" width="1070" height="18" fill="#E5E7EB" stroke="#000" stroke-width="2"/>
  <rect x="65" y="480" width="406" height="18" fill="#BAE6FD" stroke="#000" stroke-width="2"/>

  <!-- Progress Bar 3 -->
  <text x="65" y="522" font-size="11" font-weight="800">💰 Financial Aid &amp; Emergency Grants</text>
  <text x="1000" y="522" font-size="11" font-weight="800">24 requests (19%)</text>
  <rect x="65" y="530" width="1070" height="18" fill="#E5E7EB" stroke="#000" stroke-width="2"/>
  <rect x="65" y="530" width="203" height="18" fill="#A7F3D0" stroke="#000" stroke-width="2"/>

  <!-- Progress Bar 4 -->
  <text x="65" y="572" font-size="11" font-weight="800">🏠 Housing &amp; Residence Life</text>
  <text x="1000" y="572" font-size="11" font-weight="800">14 requests (10%)</text>
  <rect x="65" y="580" width="1070" height="18" fill="#E5E7EB" stroke="#000" stroke-width="2"/>
  <rect x="65" y="580" width="107" height="18" fill="#FED7AA" stroke="#000" stroke-width="2"/>
</svg>
