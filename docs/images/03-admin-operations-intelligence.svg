<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#FAF8F5; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1B4332" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="primaryGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>
  </defs>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="75" fill="#FAF8F5" stroke="#E3E8E3" stroke-width="1"/>
  <rect x="25" y="15" width="44" height="44" rx="14" fill="url(#primaryGreen)"/>
  <path d="M 40 37 L 46 43 L 56 31" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="82" y="38" font-size="20" font-weight="800" fill="#143224">DHRONA</text>
  <rect x="175" y="22" width="105" height="22" rx="11" fill="#E8F3EE" stroke="#C5DEC8" stroke-width="1"/>
  <text x="187" y="37" font-size="10" font-weight="700" fill="#2D6A4F">Care Navigator</text>
  <rect x="290" y="22" width="130" height="22" rx="11" fill="#EBF2F7" stroke="#CADCE9" stroke-width="1"/>
  <text x="300" y="37" font-size="10" font-weight="700" fill="#507693">Clinical Acuity Triage</text>
  <text x="82" y="56" font-size="11" font-weight="500" fill="#52685E">Empathetic student triage, multi-need navigation &amp; gentle companion care</text>

  <!-- Controls on right -->
  <rect x="660" y="20" width="115" height="34" rx="17" fill="#FFFFFF" stroke="#E3E8E3" stroke-width="1"/>
  <circle cx="678" cy="37" r="4" fill="#2D6A4F"/>
  <text x="690" y="42" font-size="11" font-weight="600" fill="#2D6A4F">Calm Audio: On</text>

  <rect x="785" y="20" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#E3E8E3" stroke-width="1"/>
  <text x="800" y="42" font-size="11" font-weight="600" fill="#40564C">🛡️ Anonymous</text>

  <!-- Nav Segmented Tabs -->
  <rect x="915" y="20" width="260" height="34" rx="14" fill="#EDEBE6" stroke="#DFDDD8" stroke-width="1"/>
  <text x="930" y="41" font-size="11" font-weight="600" fill="#5A6D63">Navigator</text>
  <text x="1000" y="41" font-size="11" font-weight="600" fill="#5A6D63">Companion</text>
  <text x="1080" y="41" font-size="11" font-weight="600" fill="#5A6D63">12 Silos</text>
  <rect x="1135" y="23" width="36" height="28" rx="11" fill="#FFFFFF" filter="url(#softShadow)"/>
  <text x="1142" y="41" font-size="11" font-weight="700" fill="#1B4332">Admin</text>

  <!-- Banner Ticker -->
  <rect x="0" y="75" width="1200" height="38" fill="#EBF4EF" stroke="#DFE7E1" stroke-width="1"/>
  <circle cx="35" cy="94" r="3.5" fill="#2D6A4F"/>
  <text x="48" y="98" font-size="11" font-weight="600" fill="#2A4D3B">Administrative Operational Intelligence • Transforming 3-week waitlists into immediate care pathways.</text>

  <!-- Main Card -->
  <rect x="40" y="130" width="1120" height="520" rx="24" fill="#FFFFFF" stroke="#E3E8E3" stroke-width="1" filter="url(#softShadow)"/>

  <!-- Card Header -->
  <rect x="65" y="150" width="160" height="24" rx="12" fill="#E8F3EE"/>
  <text x="75" y="166" font-size="9" font-weight="700" fill="#2D6A4F">OPERATIONAL INTELLIGENCE</text>

  <text x="65" y="205" font-size="22" font-weight="800" fill="#143224">Campus Support Triage Operations</text>
  <text x="65" y="225" font-size="12" font-weight="500" fill="#52685E">Aggregated university-level demand analytics. Demonstrates resource optimization &amp; queue elimination.</text>
  <text x="910" y="225" font-size="11" font-weight="600" fill="#7C9286" font-family="monospace">Live Campus Aggregation (Demo Data)</text>

  <!-- 4 Metrics Cards -->
  <!-- Card 1 -->
  <rect x="65" y="250" width="250" height="105" rx="18" fill="#FAF8F5" stroke="#E3E8E3" stroke-width="1"/>
  <text x="80" y="272" font-size="9" font-weight="700" fill="#7C9286">TOTAL STUDENT INQUIRIES</text>
  <text x="80" y="315" font-size="34" font-weight="800" fill="#143224">128</text>
  <text x="80" y="338" font-size="10" font-weight="500" fill="#658273">Past 7 days</text>

  <!-- Card 2 -->
  <rect x="338" y="250" width="250" height="105" rx="18" fill="#FAF8F5" stroke="#E3E8E3" stroke-width="1"/>
  <text x="353" y="272" font-size="9" font-weight="700" fill="#7C9286">MULTI-NEED INQUIRIES</text>
  <text x="353" y="315" font-size="34" font-weight="800" fill="#143224">44%</text>
  <text x="353" y="338" font-size="10" font-weight="500" fill="#658273">Cross-department cases</text>

  <!-- Card 3 -->
  <rect x="612" y="250" width="250" height="105" rx="18" fill="#FAF8F5" stroke="#E3E8E3" stroke-width="1"/>
  <text x="627" y="272" font-size="9" font-weight="700" fill="#7C9286">AVG. TIME TO HANDOFF</text>
  <text x="627" y="315" font-size="34" font-weight="800" fill="#2D6A4F">1.8m</text>
  <text x="627" y="338" font-size="10" font-weight="500" fill="#658273">Reduced from 21 days</text>

  <!-- Card 4 -->
  <rect x="885" y="250" width="250" height="105" rx="18" fill="#FAF8F5" stroke="#E3E8E3" stroke-width="1"/>
  <text x="900" y="272" font-size="9" font-weight="700" fill="#7C9286">REFERRAL BOUNCE RATE</text>
  <text x="900" y="315" font-size="34" font-weight="800" fill="#2D6A4F">&lt; 3%</text>
  <text x="900" y="338" font-size="10" font-weight="500" fill="#658273">Reduced from +40%</text>

  <!-- Demand Breakdown Header -->
  <text x="65" y="390" font-size="13" font-weight="800" fill="#143224">DEPARTMENT INFLUX &amp; DEMAND BREAKDOWN</text>

  <!-- Progress Bar 1 -->
  <text x="65" y="420" font-size="11" font-weight="700" fill="#143224">🧠 Mental Wellbeing (Counselling)</text>
  <text x="1000" y="420" font-size="11" font-weight="700" fill="#143224">42 requests (33%)</text>
  <rect x="65" y="430" width="1070" height="14" rx="7" fill="#EBF2F7"/>
  <rect x="65" y="430" width="353" height="14" rx="7" fill="#507693"/>

  <!-- Progress Bar 2 -->
  <text x="65" y="475" font-size="11" font-weight="700" fill="#143224">📚 Academic Success &amp; Advising</text>
  <text x="1000" y="475" font-size="11" font-weight="700" fill="#143224">48 requests (38%)</text>
  <rect x="65" y="485" width="1070" height="14" rx="7" fill="#E8F3EE"/>
  <rect x="65" y="485" width="406" height="14" rx="7" fill="#2D6A4F"/>

  <!-- Progress Bar 3 -->
  <text x="65" y="530" font-size="11" font-weight="700" fill="#143224">💰 Financial Aid &amp; Emergency Grants</text>
  <text x="1000" y="530" font-size="11" font-weight="700" fill="#143224">24 requests (19%)</text>
  <rect x="65" y="540" width="1070" height="14" rx="7" fill="#FDF7E7"/>
  <rect x="65" y="540" width="203" height="14" rx="7" fill="#D99B26"/>

  <!-- Progress Bar 4 -->
  <text x="65" y="585" font-size="11" font-weight="700" fill="#143224">🏠 Housing &amp; Residence Life</text>
  <text x="1000" y="585" font-size="11" font-weight="700" fill="#143224">14 requests (10%)</text>
  <rect x="65" y="595" width="1070" height="14" rx="7" fill="#FAF8F5" stroke="#E3E8E3" stroke-width="1"/>
  <rect x="65" y="595" width="107" height="14" rx="7" fill="#7C5315"/>
</svg>
