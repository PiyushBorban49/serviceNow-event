<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#FFFDF7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow4" x="0" y="0" width="200%" height="200%">
      <feOffset dx="4" dy="4" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="1"/>
      <feComposite in2="offset" in="SourceGraphic" operator="over"/>
    </filter>
    <filter id="shadow6" x="0" y="0" width="200%" height="200%">
      <feOffset dx="6" dy="6" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="1"/>
      <feComposite in2="offset" in="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="75" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <rect x="25" y="14" width="46" height="46" fill="#FFE55C" stroke="#000000" stroke-width="3" filter="url(#shadow4)"/>
  <path d="M 40 37 L 48 45 L 60 30" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <text x="85" y="38" font-size="20" font-weight="900" fill="#000000">DHRONA</text>
  <rect x="180" y="20" width="105" height="24" fill="#BAE6FD" stroke="#000000" stroke-width="2"/>
  <text x="188" y="36" font-size="10" font-weight="900" fill="#000000">STUDENT SUPPORT</text>
  <rect x="295" y="20" width="95" height="24" fill="#A7F3D0" stroke="#000000" stroke-width="2"/>
  <text x="303" y="36" font-size="10" font-weight="900" fill="#000000">CLINICAL TRIAGE</text>
  <text x="85" y="56" font-size="11" font-weight="700" fill="#4B5563">Multi-Need Navigator, Clinical Acuity Scoring &amp; Care Companion</text>

  <!-- Nav Tabs -->
  <rect x="440" y="20" width="115" height="34" fill="#F3F4F6" stroke="#000000" stroke-width="2"/>
  <rect x="475" y="24" width="75" height="26" fill="#FFE55C" stroke="#000000" stroke-width="1.5"/>
  <text x="446" y="41" font-size="9" font-weight="900">MODE:</text>
  <text x="482" y="41" font-size="9" font-weight="900">🕵️ ANONYMOUS</text>

  <rect x="565" y="20" width="105" height="34" fill="#FFE55C" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="578" y="42" font-size="11" font-weight="900">⚡ NAVIGATOR</text>

  <rect x="680" y="20" width="130" height="34" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="695" y="42" font-size="11" font-weight="900">🤖 CARE COMPANION</text>

  <rect x="820" y="20" width="95" height="34" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="835" y="42" font-size="11" font-weight="900">🏛️ 12 DEPTS</text>

  <rect x="925" y="20" width="100" height="34" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="938" y="42" font-size="11" font-weight="900">📊 ADMIN VIEW</text>

  <rect x="1035" y="20" width="85" height="34" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="1050" y="42" font-size="11" font-weight="900">🗂️ PITCH</text>

  <!-- Banner Ticker -->
  <rect x="0" y="75" width="1200" height="42" fill="#FEF08A" stroke="#000000" stroke-width="3"/>
  <rect x="25" y="83" width="170" height="26" fill="#000000"/>
  <text x="35" y="100" font-size="10" font-weight="900" fill="#FFE55C">CLINICAL TRIAGE SCORING</text>
  <text x="210" y="101" font-size="12" font-weight="800" fill="#000000">Natural Language Intake + 5 Objective Clinical Acuity Questions calibrate queue priority (P1 to P4).</text>
  <rect x="1030" y="83" width="145" height="26" fill="#000000" stroke="#000000" stroke-width="2"/>
  <text x="1045" y="100" font-size="11" font-weight="900" fill="#FFE55C">❓ LOAD TEST CASE</text>

  <!-- Step 1 Intake Container -->
  <rect x="40" y="140" width="1120" height="260" fill="#FFFFFF" stroke="#000000" stroke-width="3" filter="url(#shadow6)"/>
  <rect x="65" y="155" width="200" height="24" fill="#FFE55C" stroke="#000000" stroke-width="2"/>
  <text x="75" y="171" font-size="10" font-weight="900" fill="#000000">STEP 1 • UNIVERSAL TOPIC INTAKE</text>
  <text x="65" y="210" font-size="24" font-weight="900" fill="#000000">TELL US WHAT'S GOING ON</text>
  <text x="65" y="230" font-size="12" font-weight="700" fill="#4B5563">Describe your concerns in plain natural language. Dhrona detects concurrent needs across all 12 silos.</text>
  
  <rect x="915" y="160" width="220" height="34" fill="#BAE6FD" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="935" y="181" font-size="11" font-weight="900" fill="#000000">LOAD COMPLEX STUDENT CASE</text>

  <!-- Presets row -->
  <rect x="65" y="250" width="210" height="50" fill="#FFE55C" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <rect x="75" y="255" width="130" height="15" fill="#000" />
  <text x="80" y="266" font-size="8" font-weight="900" fill="#FFF">★ MULTI-NEED KILLER DEMO</text>
  <text x="75" y="288" font-size="10" font-weight="900" fill="#000">EXAMS + ROOMMATE + TUITION</text>

  <rect x="290" y="250" width="200" height="50" fill="#DDD6FE" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <rect x="300" y="255" width="70" height="15" fill="#000" />
  <text x="305" y="266" font-size="8" font-weight="900" fill="#FFF">DUAL NEED</text>
  <text x="300" y="288" font-size="10" font-weight="900" fill="#000">PANIC ATTACKS &amp; FAILING COURSE</text>

  <rect x="505" y="250" width="200" height="50" fill="#FED7AA" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <rect x="515" y="255" width="70" height="15" fill="#000" />
  <text x="520" y="266" font-size="8" font-weight="900" fill="#FFF">DUAL NEED</text>
  <text x="515" y="288" font-size="10" font-weight="900" fill="#000">EVICTION RISK &amp; LOST CAMPUS JOB</text>

  <rect x="720" y="250" width="190" height="50" fill="#BAE6FD" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <rect x="730" y="255" width="70" height="15" fill="#000" />
  <text x="735" y="266" font-size="8" font-weight="900" fill="#FFF">SINGLE NEED</text>
  <text x="730" y="288" font-size="10" font-weight="900" fill="#000">ACADEMIC WORKLOAD</text>

  <rect x="925" y="250" width="210" height="50" fill="#FECDD3" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <rect x="935" y="255" width="85" height="15" fill="#000" />
  <text x="940" y="266" font-size="8" font-weight="900" fill="#FFF">🚨 SAFETY TEST</text>
  <text x="935" y="288" font-size="10" font-weight="900" fill="#000">IMMEDIATE CRISIS INTERCEPT</text>

  <!-- Textarea -->
  <rect x="65" y="315" width="1070" height="65" fill="#FFFDF9" stroke="#000000" stroke-width="3"/>
  <text x="80" y="345" font-size="12" font-weight="600" fill="#6B7280" font-style="italic">Type your situation in plain words (e.g. 'I'm struggling with exams, my roommate situation is getting worse, and I'm stressed about paying tuition')...</text>

  <!-- Step 2 Clinical Acuity Container -->
  <rect x="40" y="420" width="1120" height="230" fill="#FFFFFF" stroke="#000000" stroke-width="3" filter="url(#shadow6)"/>
  <rect x="65" y="435" width="280" height="24" fill="#A7F3D0" stroke="#000000" stroke-width="2"/>
  <text x="75" y="451" font-size="10" font-weight="900" fill="#000000">STEP 2 • CLINICAL ACUITY &amp; TRIAGE ASSESSMENT</text>
  <text x="65" y="485" font-size="20" font-weight="900" fill="#000000">5-QUESTION CLINICAL ACUITY SCORING SYSTEM</text>
  <text x="65" y="505" font-size="12" font-weight="700" fill="#4B5563">Calibrates objective queue priority (P1 to P4) to protect students with acute decompensation.</text>

  <!-- Score pill on right -->
  <rect x="880" y="435" width="255" height="75" fill="#FFFDF7" stroke="#000000" stroke-width="3" filter="url(#shadow4)"/>
  <text x="920" y="455" font-size="10" font-weight="900" fill="#6B7280">CALCULATED CLINICAL SCORE</text>
  <text x="900" y="488" font-size="28" font-weight="900" fill="#000000">35 Pts</text>
  <rect x="995" y="468" width="60" height="24" fill="#BAE6FD" stroke="#000000" stroke-width="1.5"/>
  <text x="1005" y="484" font-size="11" font-weight="900" fill="#000000">P3 TIER</text>
  <text x="895" y="504" font-size="9" font-weight="800" fill="#4B5563">P3 Standard Priority (Routine 3-5 Days)</text>

  <!-- Questions Preview Cards -->
  <rect x="65" y="525" width="200" height="105" fill="#FFFDF7" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="75" y="545" font-size="9" font-weight="900" fill="#000">Q1: SAFETY (0-100 Pts)</text>
  <text x="75" y="565" font-size="9" font-weight="700" fill="#4B5563">Thoughts of self-harm?</text>
  <rect x="75" y="575" width="180" height="20" fill="#FFE55C" stroke="#000"/>
  <text x="82" y="589" font-size="9" font-weight="900">✓ No (0 Pts)</text>
  <text x="75" y="618" font-size="8" font-weight="800" fill="#DC2626">Yes = 100 Pts Instant Override</text>

  <rect x="280" y="525" width="200" height="105" fill="#FFFDF7" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="290" y="545" font-size="9" font-weight="900" fill="#000">Q2: DURATION (5-20 Pts)</text>
  <text x="290" y="565" font-size="9" font-weight="700" fill="#4B5563">How long affecting you?</text>
  <rect x="290" y="575" width="180" height="20" fill="#BAE6FD" stroke="#000"/>
  <text x="297" y="589" font-size="9" font-weight="900">✓ 1-4 Weeks (10 Pts)</text>
  <text x="290" y="618" font-size="8" font-weight="700" fill="#4B5563">Gradual buildup</text>

  <rect x="495" y="525" width="200" height="105" fill="#FFFDF7" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="505" y="545" font-size="9" font-weight="900" fill="#000">Q3: IMPACT (5-25 Pts)</text>
  <text x="505" y="565" font-size="9" font-weight="700" fill="#4B5563">Functional impairment?</text>
  <rect x="505" y="575" width="180" height="20" fill="#DDD6FE" stroke="#000"/>
  <text x="512" y="589" font-size="9" font-weight="900">✓ Moderate (10 Pts)</text>
  <text x="505" y="618" font-size="8" font-weight="700" fill="#4B5563">Struggling with sleep/study</text>

  <rect x="710" y="525" width="200" height="105" fill="#FFFDF7" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="720" y="545" font-size="9" font-weight="900" fill="#000">Q4: TRIGGERS (0-30 Pts)</text>
  <text x="720" y="565" font-size="9" font-weight="700" fill="#4B5563">External compound factors?</text>
  <rect x="720" y="575" width="180" height="20" fill="#FED7AA" stroke="#000"/>
  <text x="727" y="589" font-size="9" font-weight="900">✓ Deadline/Grades (+5 Pts)</text>
  <text x="720" y="618" font-size="8" font-weight="700" fill="#4B5563">Housing/Trauma flags</text>

  <rect x="925" y="525" width="210" height="105" fill="#FFFDF7" stroke="#000000" stroke-width="2" filter="url(#shadow4)"/>
  <text x="935" y="545" font-size="9" font-weight="900" fill="#000">Q5: DISTRESS (5-20 Pts)</text>
  <text x="935" y="565" font-size="9" font-weight="700" fill="#4B5563">Scale 1-4 breaking point?</text>
  <rect x="935" y="575" width="190" height="20" fill="#FEF08A" stroke="#000"/>
  <text x="942" y="589" font-size="9" font-weight="900">✓ 2 - Moderate (10 Pts)</text>
  <text x="935" y="618" font-size="8" font-weight="700" fill="#4B5563">Overwhelmed, need support soon</text>
</svg>
